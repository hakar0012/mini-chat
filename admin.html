<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Group Chat - Overlord Dashboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-page">
  <div class="admin-container">
    <div class="admin-header">
      <h1>👑 Overlord Dashboard</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchTab('users')">👥 Users</div>
      <div class="admin-tab" onclick="switchTab('rooms')">💬 Rooms</div>
    </div>

    <div id="usersPanel" class="admin-panel active">
      <div id="usersList"><div class="empty-state">Loading users...</div></div>
    </div>

    <div id="roomsPanel" class="admin-panel">
      <div id="roomsList"><div class="empty-state">Loading rooms...</div></div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
