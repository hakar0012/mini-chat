<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mini Group Chat - Overlord Dashboard</title>
  <link rel="stylesheet" href="css/base.css?v=5" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
</head>
<body class="admin-page">
  <div class="admin-container">
    <div class="admin-header">
      <h1>👑 Overlord Dashboard</h1>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <!-- Quick Stats -->
    <div class="admin-stats">
      <div class="stat-card">
        <span class="stat-label">Total Users</span>
        <span class="stat-value" id="statUsers">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Banned Users</span>
        <span class="stat-value" id="statBanned" style="color: var(--danger);">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Active Rooms</span>
        <span class="stat-value" id="statRooms" style="color: var(--accent);">0</span>
      </div>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchTab('users')">👥 Users</div>
      <div class="admin-tab" onclick="switchTab('rooms')">💬 Rooms</div>
    </div>

    <!-- Search Filter -->
    <div class="search-bar">
      <span class="search-bar-icon">🔍</span>
      <input type="text" id="adminSearchInput" placeholder="Filter by name or ID..." autocomplete="off" />
    </div>

    <div id="usersPanel" class="admin-panel active">
      <div id="usersList"><div class="empty-state">Loading users...</div></div>
    </div>

    <div id="roomsPanel" class="admin-panel">
      <div id="roomsList"><div class="empty-state">Loading rooms...</div></div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js?v=5"></script>
  <script src="js/admin.js?v=5"></script>
</body>
</html>
