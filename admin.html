<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlord Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #020617; color: #e5e7eb; min-height: 100vh; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
    h1 { font-size: 24px; color: #ef4444; display: flex; align-items: center; gap: 10px; }
    .btn-logout { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #1e293b; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .tab.active { background: #ef4444; color: white; }
    
    .panel { display: none; }
    .panel.active { display: block; }
    
    .list-item { background: #0f172a; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-info h3 { font-size: 16px; margin-bottom: 4px; }
    .item-info p { font-size: 12px; color: #64748b; font-family: monospace; }
    
    .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-warning { background: #f59e0b; color: black; }
    
    .badge { background: #ef4444; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 10px; }
    .empty { text-align: center; padding: 40px; color: #64748b; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👑 Overlord Dashboard</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('users')">👥 Users</div>
    <div class="tab" onclick="switchTab('rooms')">💬 Rooms</div>
  </div>

  <div id="usersPanel" class="panel active">
    <div id="usersList"><div class="empty">Loading users...</div></div>
  </div>

  <div id="roomsPanel" class="panel">
    <div id="roomsList"><div class="empty">Loading rooms...</div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // -------------------------------------------------------
    // PASTE YOUR FIREBASE CONFIG HERE
    // -------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyAbiBOlaMX7OjPvx5efi0Z3MOddr94wgKQ",
      authDomain: "mini-chaty.firebaseapp.com",
      databaseURL: "https://mini-chaty-default-rtdb.firebaseio.com",
      projectId: "mini-chaty",
      storageBucket: "mini-chaty.firebasestorage.app",
      messagingSenderId: "524920955180",
      appId: "1:524920955180:web:3b9f8ff90e89a709388c89"
    };
    
    // PASTE YOUR EXACT ADMIN UID HERE
    const ADMIN_UID = 'Gzw028WXugRIWJyBJ8xYqKypAu03'; 
    // -------------------------------------------------------

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let allUsers = {};
    let bannedUsers = {};

    // 1. Security Check
    auth.onAuthStateChanged(async (user) => {
      if (!user || user.uid !== ADMIN_UID) {
        alert("ACCESS DENIED. Overlord privileges required.");
        window.location.href = 'login.html';
        return;
      }
      loadData();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      if (tab === 'users') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('usersPanel').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('roomsPanel').classList.add('active');
        loadRooms();
      }
    }

    async function loadData() {
      const usersSnap = await db.ref('users').once('value');
      allUsers = usersSnap.val() || {};
      
      const bannedSnap = await db.ref('bannedUsers').once('value');
      bannedUsers = bannedSnap.val() || {};
      
      renderUsers();
    }

    function renderUsers() {
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      
      const uids = Object.keys(allUsers);
      if (uids.length === 0) {
        list.innerHTML = '<div class="empty">No users found.</div>';
        return;
      }

      uids.forEach(uid => {
        const user = allUsers[uid];
        const isBanned = bannedUsers[uid] === true;
        const isMe = uid === ADMIN_UID;
        
        const div = document.createElement('div');
        div.className = 'list-item';
        
        div.innerHTML = `
          <div class="item-info">
            <h3>${user.name || 'Unknown'} ${isMe ? '<span style="color:#f59e0b;">(You)</span>' : ''} ${isBanned ? '<span class="badge">BANNED</span>' : ''}</h3>
            <p>${uid}</p>
          </div>
          <div>
            ${isMe ? '' : (isBanned 
              ? `<button class="btn btn-success" onclick="unbanUser('${uid}')">Unban</button>` 
              : `<button class="btn btn-danger" onclick="banUser('${uid}')">Ban</button>`)}
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function banUser(uid) {
      if(confirm("Ban this user? They will be instantly kicked out and blocked from logging in.")) {
        await db.ref('bannedUsers/' + uid).set(true);
        bannedUsers[uid] = true;
        renderUsers();
      }
    }

    async function unbanUser(uid) {
      await db.ref('bannedUsers/' + uid).remove();
      delete bannedUsers[uid];
      renderUsers();
    }

    async function loadRooms() {
      const list = document.getElementById('roomsList');
      list.innerHTML = '<div class="empty">Loading rooms...</div>';
      
      const roomsSnap = await db.ref('rooms').once('value');
      const rooms = roomsSnap.val() || {};
      list.innerHTML = '';
      
      const roomIds = Object.keys(rooms);
      if (roomIds.length === 0) {
        list.innerHTML = '<div class="empty">No rooms exist yet.</div>';
        return;
      }

      roomIds.forEach(id => {
        const msgCount = rooms[id].messages ? Object.keys(rooms[id].messages).length : 0;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="item-info">
            <h3># ${id}</h3>
            <p>${msgCount} messages</p>
          </div>
          <button class="btn btn-warning" onclick="wipeRoom('${id}')">Wipe Room</button>
        `;
        list.appendChild(div);
      });
    }

    async function wipeRoom(roomId) {
      if(confirm(`⚠️ WARNING: This will permanently delete ALL messages, reactions, and typing data in #${roomId}. Continue?`)) {
        await db.ref('rooms/' + roomId).remove();
        loadRooms();
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.href = 'login.html');
    }
  </script>
</body>
</html>
