<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Group Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header strong {
      font-size: 15px;
    }

    #roomLabel {
      opacity: 0.65;
      font-size: 12px;
    }

    #nameBar {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 8px;
    }

    #nameBar input {
      max-width: 240px;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 85%;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: #2563eb;
    }

    .meta {
      font-size: 11px;
      opacity: 0.72;
      margin-bottom: 3px;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    input {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 15px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <strong>Mini Group Chat</strong>
    <span id="roomLabel"></span>
  </header>

  <div id="nameBar">
    <input id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off" />
    <button id="saveName" type="button">Join</button>
  </div>

  <main id="messages" aria-live="polite"></main>

  <form id="chatForm" class="hidden">
    <input id="textInput" placeholder="Type a message" maxlength="1000" autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
base
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // -------------------------------------------------------
    // PASTE YOUR FIREBASE CONFIG HERE
    // -------------------------------------------------------
// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAbiBOlaMX7OjPvx5efi0Z3MOddr94wgKQ",
  authDomain: "mini-chaty.firebaseapp.com",
  databaseURL: "https://mini-chaty-default-rtdb.firebaseio.com",
  projectId: "mini-chaty",
  storageBucket: "mini-chaty.firebasestorage.app",
  messagingSenderId: "524920955180",
  appId: "1:524920955180:web:3b9f8ff90e89a709388c89"
};


    // -------------------------------------------------------

    if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE_")) {
      document.body.innerHTML =
        "<p style='padding:20px;font-family:sans-serif;'>Open index.html and paste your Firebase config first.</p>";
      throw new Error("Missing Firebase config");
    }

    // Use a room name from the URL:
    // https://yourname.github.io/yourrepo/?room=mysecretroom
    const params = new URLSearchParams(location.search);
    const room = (params.get("room") || "general").trim().slice(0, 80);

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref("rooms/" + room + "/messages");

    const messagesEl = document.getElementById("messages");
    const nameBar = document.getElementById("nameBar");
    const nameInput = document.getElementById("nameInput");
    const saveNameBtn = document.getElementById("saveName");
    const chatForm = document.getElementById("chatForm");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const roomLabel = document.getElementById("roomLabel");

    roomLabel.textContent = "room: " + room;

    let myName = localStorage.getItem("chat_name") || "";

    function ready() {
      return myName.trim().length > 0;
    }

    function showChatUI() {
      nameBar.classList.add("hidden");
      chatForm.classList.remove("hidden");
      textInput.focus();
    }

    function showNameUI() {
      nameBar.classList.remove("hidden");
      chatForm.classList.add("hidden");
      nameInput.value = myName;
      nameInput.focus();
    }

    function join() {
      const n = nameInput.value.trim();
      if (!n) {
        nameInput.focus();
        return;
      }

      myName = n;
      localStorage.setItem("chat_name", myName);
      showChatUI();
    }

    saveNameBtn.addEventListener("click", join);

    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") join();
    });

    function timeLabel(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function addMessage(data) {
      const nearBottom =
        messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;

      const div = document.createElement("div");
      div.className = "msg" + ((data.name || "") === myName ? " me" : "");

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${data.name || "anon"} · ${timeLabel(data.ts)}`;

      const body = document.createElement("div");
      body.textContent = data.text || "";

      div.appendChild(meta);
      div.appendChild(body);

      messagesEl.appendChild(div);

      const isMine = (data.name || "") === myName;
      if (nearBottom || isMine) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }

    // Load latest 100 messages, then listen for new ones.
    let chatStarted = false;

    firebase.auth().onAuthStateChanged((user) => {
      if (!user || chatStarted) return;

      chatStarted = true;

      messagesRef
        .orderByChild("ts")
        .limitToLast(100)
        .on("child_added", (snap) => {
          const val = snap.val();
          if (val) addMessage(val);
        });
    });

    firebase.auth().signInAnonymously().catch((err) => {
      alert("Auth failed: " + err.message);
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!ready()) {
        showNameUI();
        return;
      }

      const text = textInput.value.trim();
      if (!text) return;

      sendBtn.disabled = true;

      try {
        if (!firebase.auth().currentUser) {
          await firebase.auth().signInAnonymously();
        }
        await messagesRef.push({
          name: myName,
          text: text,
          ts: Date.now()
        });

        textInput.value = "";
        textInput.focus();
      } catch (err) {
        alert("Send failed: " + err.message);
      } finally {
        sendBtn.disabled = false;
      }
    });

    if (ready()) {
      showChatUI();
    } else {
      showNameUI();
    }
  </script>
</body>
</html>
