<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Group Chat</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body class="chat-page">
  <!-- Header Bar -->
  <header></header>

  <!-- Messages Scroll Area -->
  <main id="messages" aria-live="polite"></main>

  <!-- Typing Indicator -->
  <div id="typingIndicator"></div>

  <!-- Reply Preview Bar -->
  <div id="replyBar">
    Replying to <strong id="replyName"></strong>
    <span class="close" onclick="cancelReply()">×</span>
  </div>
  
  <!-- Message Composer Form -->
  <form id="chatForm" class="hidden">
    <input type="file" id="imageInput" accept="image/*" style="display: none;" />
    
    <div style="position: relative;">
      <button type="button" id="attachBtn" class="btn-attach" title="Attach media">+</button>
      <div id="attachMenu" class="attach-menu hidden">
        <button type="button" id="attachImageBtn" class="attach-menu-item">🖼️ Image</button>
        <button type="button" id="attachGifBtn" class="attach-menu-item">🎞️ GIF</button>
      </div>
    </div>

    <input type="text" id="textInput" placeholder="Type a message" maxlength="1000" autocomplete="off" />
    <button id="sendBtn" type="submit" class="btn-primary">Send</button>
  </form>

  <!-- Online Users Modal -->
  <div id="onlineModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Online Users</strong>
        <span class="close-modal" onclick="toggleOnlineModal()">×</span>
      </div>
      <div id="onlineList"></div>
    </div>
  </div>

  <!-- Room Switcher Drawer -->
  <div id="roomPanelOverlay" class="room-panel-overlay" onclick="closeRoomPanel()"></div>
  <div id="roomPanel" class="room-panel">
    <div class="room-panel-header">
      <h3>Rooms</h3>
      <button class="room-panel-close" onclick="closeRoomPanel()">×</button>
    </div>
    <div class="room-panel-content">
      <input type="text" id="newRoomInput" class="room-panel-input" placeholder="New room name..." onkeydown="if(event.key==='Enter') joinNewRoom()" />
      <button class="room-panel-btn" onclick="joinNewRoom()">Join / Create</button>
      <div class="room-panel-section">
        <div class="room-panel-section-label">Recent Rooms</div>
        <div id="roomPanelList"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
