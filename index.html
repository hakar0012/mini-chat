<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mini Group Chat</title>
  <link rel="stylesheet" href="css/base.css?v=10" />
  <link rel="stylesheet" href="css/chat.css?v=10" />
</head>
<body class="chat-page">
  <!-- Header Bar (Full Width) -->
  <header id="chatHeader"></header>

  <!-- Messages Scroll Area (Full Width) -->
  <main id="messages" aria-live="polite"></main>

  <!-- Typing Indicator -->
  <div id="typingIndicator"></div>

  <!-- Composer Section with Docked Reply Bar (Full Width) -->
  <div class="composer-wrapper">
    <!-- Reply Preview Bar -->
    <div id="replyBar">
      <div class="reply-bar-info" id="replyName"></div>
      <span class="reply-bar-close" onclick="cancelReply()" title="Cancel reply (Esc)">×</span>
    </div>
    
    <!-- Message Composer Form -->
    <form id="chatForm" class="hidden">
      <input type="file" id="imageInput" accept="image/*" style="display: none;" />
      
      <div style="position: relative;">
        <button type="button" id="attachBtn" class="btn-attach" title="Attach image or GIF">+</button>
        <div id="attachMenu" class="attach-menu hidden">
          <button type="button" id="attachImageBtn" class="attach-menu-item">🖼️ Upload Image</button>
          <button type="button" id="attachGifBtn" class="attach-menu-item">🎞️ Search GIFs</button>
          <button type="button" id="attachPollBtn" class="attach-menu-item">📊 Create Poll</button>
        </div>
      </div>

      <div style="position: relative; flex: 1; display: flex; align-items: center;">
        <input type="text" id="textInput" placeholder="Type a message..." maxlength="1000" autocomplete="off" />
        <button type="button" id="emojiBtn" class="btn-emoji-trigger" title="Insert Emoji">😊</button>
      </div>

      <button id="sendBtn" type="submit">Send</button>
    </form>

    <!-- Built-in Emoji Picker Popup -->
    <div id="emojiPickerPopup" class="emoji-picker-popup hidden"></div>

    <!-- @mention Autocomplete Dropdown -->
    <div id="mentionPopup" class="mention-popup hidden"></div>

    <!-- Jump to Bottom Pill -->
    <button id="jumpBottomBtn" class="jump-bottom-btn hidden" onclick="jumpToBottom()">
      ↓ <span id="jumpBottomText">New messages</span>
    </button>
  </div>

  <!-- Online Users Modal -->
  <div id="onlineModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Online Users</strong>
        <span class="close-modal" onclick="toggleOnlineModal()">×</span>
      </div>
      <div id="onlineList"></div>
    </div>
  </div>

  <!-- Notification Settings Modal -->
  <div id="notifModal" class="modal hidden">
    <div class="modal-content" style="max-width: 360px;">
      <div class="modal-header">
        <strong>🔔 Notification Settings</strong>
        <span class="close-modal" onclick="toggleNotifModal()">×</span>
      </div>
      
      <div class="notif-settings-body">
        <!-- Master Mute Toggle -->
        <div class="notif-option-row highlight-row">
          <div>
            <div class="notif-title">Mute All Alerts</div>
            <div class="notif-desc">Silence all sounds & popups</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="notifMasterMute" onchange="saveNotifPrefs()" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Normal Messages Section -->
        <div class="notif-section-title">💬 Normal Messages</div>
        <div class="notif-option-row">
          <span>Play Sound</span>
          <label class="toggle-switch">
            <input type="checkbox" id="notifNormalSound" onchange="saveNotifPrefs()" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notif-option-row">
          <span>Desktop Notification</span>
          <label class="toggle-switch">
            <input type="checkbox" id="notifNormalDesktop" onchange="saveNotifPrefs()" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Mentions Section -->
        <div class="notif-section-title">📣 @Mentions & Replies</div>
        <div class="notif-option-row">
          <span>Play Sound</span>
          <label class="toggle-switch">
            <input type="checkbox" id="notifMentionSound" onchange="saveNotifPrefs()" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="notif-option-row">
          <span>Desktop Notification</span>
          <label class="toggle-switch">
            <input type="checkbox" id="notifMentionDesktop" onchange="saveNotifPrefs()" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Test Sound Actions -->
        <div class="notif-test-actions">
          <button type="button" class="btn-test-sound" onclick="testSound(false)">🎵 Test Message</button>
          <button type="button" class="btn-test-sound" onclick="testSound(true)">🔔 Test Mention</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Room Switcher Drawer -->
  <div id="roomPanelOverlay" class="room-panel-overlay" onclick="closeRoomPanel()"></div>
  <div id="roomPanel" class="room-panel">
    <div class="room-panel-header">
      <h3>💬 Chat Rooms</h3>
      <button class="close-modal" onclick="closeRoomPanel()">×</button>
    </div>
    <div class="room-panel-content">
      <input type="text" id="newRoomInput" class="room-panel-input" placeholder="New room name..." onkeydown="if(event.key==='Enter') joinNewRoom()" />
      <button class="room-panel-btn" onclick="joinNewRoom()">Join / Create Room</button>
      <div class="room-panel-section">
        <div class="room-panel-section-label" style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; font-weight: 600;">Recent Rooms</div>
        <div id="roomPanelList"></div>
      </div>
    </div>
  </div>

  <!-- Create Poll Modal -->
  <div id="pollModal" class="modal hidden">
    <div class="modal-content" style="max-width: 380px;">
      <div class="modal-header">
        <strong>📊 Create a Poll</strong>
        <span class="close-modal" onclick="togglePollModal()">×</span>
      </div>
      <form id="pollForm" onsubmit="submitPollForm(event)">
        <div style="margin-bottom: 12px;">
          <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Question</label>
          <input type="text" id="pollQuestionInput" class="room-panel-input" placeholder="Ask a question..." required maxlength="200" autocomplete="off" />
        </div>

        <div style="margin-bottom: 12px;">
          <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Options</label>
          <div id="pollOptionsContainer" style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" class="room-panel-input poll-option-input" placeholder="Option 1" required maxlength="80" autocomplete="off" />
            <input type="text" class="room-panel-input poll-option-input" placeholder="Option 2" required maxlength="80" autocomplete="off" />
          </div>
          <button type="button" class="btn-test-sound" style="width: 100%; margin-top: 8px;" onclick="addPollOptionRow()">+ Add Option</button>
        </div>

        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
          <button type="button" class="btn-test-sound" onclick="togglePollModal()">Cancel</button>
          <button type="submit" class="room-panel-btn" style="margin: 0; width: auto; padding: 0 18px;">Create Poll</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js?v=10"></script>
  <script src="js/chat.js?v=10"></script>
</body>
</html>
