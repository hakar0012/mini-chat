<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Group Chat</title>
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; height: 100dvh; display: flex; flex-direction: column; background: #0f172a; color: #e5e7eb; }
    header { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); display: flex; align-items: center; gap: 10px; }
    header strong { font-size: 15px; }
    #roomLabel { opacity: 0.65; font-size: 12px; }
    #nameBar { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); display: flex; gap: 8px; }
    #nameBar input { max-width: 240px; }
    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
    .msg.me { align-self: flex-end; background: #2563eb; }
    .meta { font-size: 11px; opacity: 0.72; margin-bottom: 3px; }
    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
    input { flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 16px; outline: none; }
    button { border: 0; border-radius: 10px; padding: 0 16px; font-size: 15px; cursor: pointer; background: #2563eb; color: white; }
    button:disabled { opacity: 0.55; }
    .hidden { display: none !important; }
    
    .msg-row { position: relative; }
    .msg-actions { position: absolute; top: 4px; background: rgba(0,0,0,0.3); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; z-index: 10; opacity: 0.6; }
    .msg-actions:hover { opacity: 1; }
    .msg-actions.me { left: 6px; }
    .msg-actions.other { right: 6px; }
    .msg-menu { position: absolute; top: 28px; right: 0; background: #334155; border-radius: 6px; padding: 4px; display: none; flex-direction: column; z-index: 20; min-width: 80px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .msg-menu.active { display: flex; }
    .msg-menu button { background: none; border: none; color: white; padding: 6px; text-align: left; cursor: pointer; border-radius: 4px; width: 100%; font-size: 13px; }
    .msg-menu button:hover { background: #475569; }
    .reply-preview { background: rgba(255,255,255,0.1); border-left: 3px solid #2563eb; padding: 4px 8px; margin-bottom: 4px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    #replyBar { display: none; padding: 8px 14px; background: #1e293b; border-top: 1px solid #334155; font-size: 14px; position: relative; }
    #replyBar.active { display: block; }
    #replyBar .close { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; opacity: 0.7; }
    .edited { font-size: 10px; opacity: 0.6; margin-left: 6px; }
    .highlight { animation: flash 1.5s; }
    @keyframes flash { 0% { background: #49cbd0; } 100% { background: transparent; } }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal.hidden { display: none !important; }
    .modal-content { background: #1e293b; border-radius: 12px; padding: 16px; width: 90%; max-width: 300px; max-height: 70vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .close-modal { cursor: pointer; font-size: 22px; opacity: 0.8; }
    .online-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .online-item:last-child { border-bottom: none; }
      .reaction-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 2px 8px; font-size: 12px; cursor: pointer;
      margin-right: 4px; margin-top: 4px; user-select: none;
    }
    .reaction-pill.mine { background: rgba(37,99,235,0.3); border-color: #2563eb; }
    .reaction-picker {
      position: absolute; bottom: 100%; left: 0; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 4px 8px; display: flex; gap: 8px; z-index: 30;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 4px;
    }
    .reaction-picker span { font-size: 20px; cursor: pointer; transition: transform 0.1s; }
    .reaction-picker span:hover { transform: scale(1.3); }
        /* Mentions and Markdown */
    .mention { color: #60a5fa; font-weight: bold; }
    .mention-me { background: rgba(37,99,235,0.3); padding: 0 4px; border-radius: 4px; color: white; }
    .msg code { background: rgba(0,0,0,0.4); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    
    /* Room Switcher */
    .room-list-item { padding: 10px; cursor: pointer; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .room-list-item:hover { background: rgba(255,255,255,0.1); }
    .room-list-item.active { background: #2563eb; }
    .room-btn { cursor: pointer; margin-left: 8px; opacity: 0.7; font-size: 18px; }
    .room-btn:hover { opacity: 1; }
  </style>
  
</head>

<body>
  <header>
    <strong>Mini Group Chat</strong>
    <span id="roomLabel"></span>
  </header>

  <div id="nameBar">
    <input id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off" />
    <button id="saveName" type="button">Join</button>
  </div>

  <main id="messages" aria-live="polite"></main>
    <div id="typingIndicator" style="padding: 0 14px 4px; font-size: 12px; opacity: 0.7; min-height: 16px; font-style: italic;"></div>
  <div id="replyBar">
    Replying to <strong id="replyName"></strong>
    <span class="close" onclick="cancelReply()">×</span>
  </div>
  
  <form id="chatForm" class="hidden">
    <input type="file" id="imageInput" accept="image/*" style="display: none;" />
    <button type="button" id="attachBtn" title="Attach Image" style="padding: 0 12px; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #e5e7eb; border-radius: 10px; cursor: pointer; font-size: 18px;">📎</button>
    <input id="textInput" placeholder="Type a message" maxlength="1000" autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbiBOlaMX7OjPvx5efi0Z3MOddr94wgKQ",
      authDomain: "mini-chaty.firebaseapp.com",
      databaseURL: "https://mini-chaty-default-rtdb.firebaseio.com",
      projectId: "mini-chaty",
      storageBucket: "mini-chaty.firebasestorage.app",
      messagingSenderId: "524920955180",
      appId: "1:524920955180:web:3b9f8ff90e89a709388c89"
    };

    const params = new URLSearchParams(location.search);
    const room = (params.get("room") || "general").trim().slice(0, 80);

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref("rooms/" + room + "/messages");

    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const roomLabel = document.getElementById("roomLabel");
    const header = document.querySelector("header");
    const replyBar = document.getElementById("replyBar");
    const replyName = document.getElementById("replyName");
    const imageInput = document.getElementById("imageInput");
    const attachBtn = document.getElementById("attachBtn");

    roomLabel.textContent = "room: " + room;

    let myName = "", myUid = "", myAvatarType = "", myAvatarValue = "";
    let messagesCache = {};
    let replyingTo = null;
    let editingId = null;
    let onlineUsers = {};
    let userProfilesCache = {};

        // --- Room Switcher Logic ---
    function getRooms() {
        return JSON.parse(localStorage.getItem('chat_rooms') || '["global","general"]');
    }
    function saveRoom(name) {
        let rooms = getRooms();
        if (!rooms.includes(name)) {
            rooms.unshift(name);
            localStorage.setItem('chat_rooms', JSON.stringify(rooms.slice(0, 10)));
        }
    }
    saveRoom(room); // Save current room on load

    window.toggleRoomModal = () => {
        document.getElementById('roomModal').classList.toggle('hidden');
        if (!document.getElementById('roomModal').classList.contains('hidden')) renderRoomList();
    };
    window.joinNewRoom = () => {
        const input = document.getElementById('newRoomInput');
        const name = input.value.trim().toLowerCase().replace(/\s+/g, '-');
        if (name) {
            saveRoom(name);
            window.location.search = '?room=' + encodeURIComponent(name);
        }
    };
    function renderRoomList() {
        const list = document.getElementById('roomList');
        list.innerHTML = '';
        getRooms().forEach(r => {
            const div = document.createElement('div');
            div.className = 'room-list-item' + (r === room ? ' active' : '');
            div.innerHTML = `<span># ${r}</span>`;
            div.onclick = () => { if (r !== room) window.location.search = '?room=' + encodeURIComponent(r); };
            list.appendChild(div);
        });
    }

    function updateOnlineUI() {
      const count = Object.keys(onlineUsers).length;
      const countEl = document.getElementById('onlineCount');
      if (countEl) countEl.textContent = `🟢 ${count} online`;
    }

    window.toggleOnlineModal = () => {
      const modal = document.getElementById('onlineModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderOnlineList();
    };

    function renderOnlineList() {
      const listEl = document.getElementById('onlineList');
      listEl.innerHTML = "";
      const uids = Object.keys(onlineUsers);
      if (uids.length === 0) {
        listEl.innerHTML = "<p style='opacity:0.6; margin:0;'>No one is online.</p>";
        return;
      }
      uids.forEach(uid => {
        const profile = userProfilesCache[uid] || { name: "Unknown", avatarType: 'initials', avatarValue: '#334155' };
        const item = document.createElement("div");
        item.className = "online-item";
        item.appendChild(createAvatarEl(profile.avatarType, profile.avatarValue, profile.name, uid));
        const nameSpan = document.createElement("span");
        nameSpan.textContent = profile.name;
        item.appendChild(nameSpan);
        listEl.appendChild(item);
      });
    }

    function cacheProfile(data) {
      if (data && data.uid && !userProfilesCache[data.uid]) {
        userProfilesCache[data.uid] = { name: data.name, avatarType: data.avatarType, avatarValue: data.avatarValue };
      }
    }
          function createAvatarEl(type, value, name, uid) {
      const el = document.createElement("div");
      el.style.cssText = "width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;flex-shrink:0;";
      if (type === 'preset') {
        el.textContent = value || '👤';
        el.style.background = '#1e293b';
      } else {
        el.textContent = (name || '?').charAt(0).toUpperCase();
        el.style.background = value || '#2563eb';
      }
      return el;
    }

    function timeLabel(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
        function parseMarkdownAndMentions(text) {
        // Escape HTML to prevent hacking
        let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

        // Mentions: @Name
        safeText = safeText.replace(/@([a-zA-Z0-9_]+)/g, (match, name) => {
            const matchUser = Object.values(userProfilesCache).find(p => p.name.toLowerCase() === name.toLowerCase());
            if (matchUser) {
                const isMe = matchUser.name.toLowerCase() === myName.toLowerCase();
                return `<span class="mention ${isMe ? 'mention-me' : ''}">${match}</span>`;
            }
            return match;
        });

        // Markdown: `code`, *bold*, _italic_
        safeText = safeText.replace(/`([^`]+)`/g, '<code>$1</code>');
        safeText = safeText.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
        safeText = safeText.replace(/_([^_]+)_/g, '<em>$1</em>');

        return safeText;
    }

    function parseMessageText(text) {
        if (!text) return document.createTextNode("");
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const parts = text.split(urlRegex);
        const fragment = document.createDocumentFragment();

        parts.forEach(part => {
            if (/^https?:\/\/[^\s]+$/i.test(part)) {
                const lowerPart = part.toLowerCase();
                const isImage = /\.(jpe?g|png|gif|webp|bmp|svg)(\?.*)?$/.test(lowerPart);
                const isVideo = /\.(mp4|webm|ogg|mov)(\?.*)?$/.test(lowerPart);
                
                if (isImage) {
                    const container = document.createElement("div");
                    container.style.marginTop = "6px";
                    const img = document.createElement("img");
                    img.src = part;
                    img.style.cssText = "max-width:100%;max-height:300px;border-radius:8px;display:block;";
                    img.loading = "lazy";
                    img.onerror = () => { 
                        container.innerHTML = "";
                        const a = document.createElement("a");
                        a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer";
                        a.textContent = part; a.style.cssText = "color:#60a5fa;word-break:break-all;";
                        container.appendChild(a);
                    };
                    container.appendChild(img);
                    fragment.appendChild(container);
                } else if (isVideo) {
                    const container = document.createElement("div");
                    container.style.marginTop = "6px";
                    const video = document.createElement("video");
                    video.src = part; video.controls = true;
                    video.style.cssText = "max-width:100%;max-height:300px;border-radius:8px;";
                    video.onerror = () => {
                        container.innerHTML = "";
                        const a = document.createElement("a");
                        a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer";
                        a.textContent = part; a.style.cssText = "color:#60a5fa;word-break:break-all;";
                        container.appendChild(a);
                    };
                    container.appendChild(video);
                    fragment.appendChild(container);
                } else {
                    const a = document.createElement("a");
                    a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer";
                    a.textContent = part; a.style.cssText = "color:#60a5fa;text-decoration:underline;word-break:break-all;";
                    fragment.appendChild(a);
                }
            } else if (part.length > 0) {
                // Apply Markdown and Mentions to text parts!
                const span = document.createElement('span');
                span.innerHTML = parseMarkdownAndMentions(part);
                fragment.appendChild(span);
            }
        });
        return fragment;
    }
        const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🔥'];

    function showReactionPicker(msgId, anchorEl) {
      const existing = document.querySelector('.reaction-picker');
      if (existing) existing.remove();
      
      const picker = document.createElement('div');
      picker.className = 'reaction-picker';
      
      EMOJIS.forEach(em => {
        const span = document.createElement('span');
        span.textContent = em;
        span.onclick = (e) => {
          e.stopPropagation();
          db.ref(`rooms/${room}/reactions/${msgId}/${em}/${myUid}`).set(true);
          picker.remove();
        };
        picker.appendChild(span);
      });
      
      anchorEl.appendChild(picker);
      
      setTimeout(() => {
        document.body.onclick = () => { 
          picker.remove(); 
          document.body.onclick = null; 
        };
      }, 10);
    }
    // NEW: Separate rendering function so updates don't jump to the bottom
    function renderMessage(data, msgId) {
      const row = document.createElement("div");
      row.className = "msg-row";
      row.id = "msg-" + msgId;
      row.style.cssText = "display:flex; gap:8px; max-width:85%; align-items:flex-end; margin-bottom:4px;";
      
      const isMine = data.uid === myUid;
      if (isMine) { row.style.marginLeft = "auto"; row.style.flexDirection = "row-reverse"; }

      const avatar = createAvatarEl(data.avatarType, data.avatarValue, data.name, data.uid);

      const msgBox = document.createElement("div");
      msgBox.className = "msg" + (isMine ? " me" : "");
      msgBox.style.position = "relative";

      if (data.replyToId) {
        const rep = document.createElement("div");
        rep.className = "reply-preview";
        rep.innerHTML = `<strong>${data.replyToName}</strong><br>${data.replyToText}`;
        rep.onclick = () => {
          const el = document.getElementById('msg-' + data.replyToId);
          if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('highlight'); setTimeout(()=>el.classList.remove('highlight'), 1500); }
        };
        msgBox.appendChild(rep);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `${data.name || "anon"} · ${timeLabel(data.ts)} ${data.edited ? '<span class="edited">(edited)</span>' : ''}`;

      const body = document.createElement("div");
      body.appendChild(parseMessageText(data.text));

      msgBox.appendChild(meta);
      msgBox.appendChild(body);

      const reactionsContainer = document.createElement("div");
      reactionsContainer.className = "reactions-container";
      reactionsContainer.style.cssText = "display:flex; flex-wrap:wrap; margin-top:4px;";
      msgBox.appendChild(reactionsContainer);

      msgBox.ondblclick = () => showReactionPicker(msgId, msgBox);
      let pressTimer;
      msgBox.ontouchstart = () => { pressTimer = setTimeout(() => showReactionPicker(msgId, msgBox), 500); };
      msgBox.ontouchend = () => clearTimeout(pressTimer);
      msgBox.ontouchmove = () => clearTimeout(pressTimer);
      
      const actions = document.createElement("div");
      actions.className = "msg-actions " + (isMine ? "me" : "other");
      actions.innerHTML = "⋮";
      
            const menu = document.createElement("div");
      menu.className = "msg-menu";
      
      const replyBtn = document.createElement("button");
      replyBtn.textContent = "Reply";
      replyBtn.onclick = (e) => { e.stopPropagation(); startReply(msgId); };
      menu.appendChild(replyBtn);

      if (isMine) {
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.onclick = (e) => { e.stopPropagation(); startEdit(msgId); };
        menu.appendChild(editBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = (e) => { e.stopPropagation(); deleteMsg(msgId); };
        menu.appendChild(deleteBtn);
      }
      actions.appendChild(menu);
      actions.onclick = (e) => { 
        e.stopPropagation(); 
        document.querySelectorAll('.msg-menu.active').forEach(m => m.classList.remove('active'));
        menu.classList.toggle('active'); 
      };

      msgBox.appendChild(actions);
      row.appendChild(avatar);
      row.appendChild(msgBox);
      
      return row;
    }

    function addMessage(data, msgId, prepend = false) {
      cacheProfile(data);
      messagesCache[msgId] = data;
      const row = renderMessage(data, msgId);

      if (prepend) {
        // Put old messages at the very top
        messagesEl.insertBefore(row, messagesEl.firstChild);
      } else {
        // Put new messages at the bottom
        const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
        messagesEl.appendChild(row);
        const isMine = data.uid === myUid;
        if (nearBottom || isMine) messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      updateOnlineUI();
    }
        let oldestTs = Infinity;
    let newestTs = 0;
    let isLoadingOlder = false;
    let allOlderLoaded = false;
    let newMsgListenerAttached = false;

    function loadOlderMessages() {
      if (isLoadingOlder || allOlderLoaded) return;
      isLoadingOlder = true;
      const prevScrollHeight = messagesEl.scrollHeight;

      // Fetch the next 30 older messages
      messagesRef.orderByChild("ts").endAt(oldestTs - 1).limitToLast(30).once("value", (snap) => {
        if (snap.numChildren() === 0) {
          allOlderLoaded = true; // Stop searching if we hit the beginning of time
          isLoadingOlder = false;
          return;
        }

        const messages = [];
        snap.forEach(child => {
          messages.push({ val: child.val(), key: child.key });
          if (child.val().ts < oldestTs) oldestTs = child.val().ts;
        });

        // Add them to the top in the correct order
        messages.reverse().forEach(m => addMessage(m.val, m.key, true));

        // MAGIC: Keep the user's scroll position exactly where it was!
        messagesEl.scrollTop = messagesEl.scrollHeight - prevScrollHeight;
        isLoadingOlder = false;
      });
    }

    // Trigger the load when you scroll to the very top
    messagesEl.addEventListener('scroll', () => {
      if (messagesEl.scrollTop === 0) {
        loadOlderMessages();
      }
    });

    window.startReply = (id) => {
      const msg = messagesCache[id];
      replyingTo = { id: id, name: msg.name, text: (msg.text || "").substring(0, 40) };
      replyBar.classList.add("active");
      replyName.textContent = msg.name;
      document.querySelectorAll('.msg-menu.active').forEach(m => m.classList.remove('active'));
      textInput.focus();
    };

    window.cancelReply = () => {
      replyingTo = null;
      replyBar.classList.remove("active");
    };

    window.startEdit = (id) => {
      const msg = messagesCache[id];
      editingId = id;
      textInput.value = msg.text;
      sendBtn.textContent = "Save";
      cancelReply();
      document.querySelectorAll('.msg-menu.active').forEach(m => m.classList.remove('active'));
      textInput.focus();
    };

    window.deleteMsg = async (id) => {
      document.querySelectorAll('.msg-menu.active').forEach(m => m.classList.remove('active'));
      if(!confirm("Delete this message?")) return;
      try {
        await messagesRef.child(id).remove();
        // FIXED: Removed the accidental typo that was breaking this
        const el = document.getElementById("msg-" + id);
        if(el) el.remove();
        delete messagesCache[id];
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    };

    document.body.onclick = () => {
      document.querySelectorAll('.msg-menu.active').forEach(m => m.classList.remove('active'));
    };

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user || user.isAnonymous) {
        window.location.href = 'login.html';
        return;
      }
      myUid = user.uid;
      const myPresenceRef = db.ref("presence/" + myUid);
      myPresenceRef.set(true);
      myPresenceRef.onDisconnect().remove();

      db.ref("presence").on("value", async (snap) => {
        onlineUsers = snap.val() || {};
        const uids = Object.keys(onlineUsers);
        const missingUids = uids.filter(uid => !userProfilesCache[uid]);
        if (missingUids.length > 0) {
          const promises = missingUids.map(uid => db.ref('users/' + uid).once('value'));
          const snaps = await Promise.all(promises);
          snaps.forEach((s, i) => {
            if (s.exists()) userProfilesCache[missingUids[i]] = s.val();
          });
        }
        updateOnlineUI();
      });
      db.ref(`rooms/${room}/reactions`).on('value', (snap) => {
        const allReactions = snap.val() || {};
        document.querySelectorAll('.reactions-container').forEach(c => c.innerHTML = '');
        
        Object.keys(allReactions).forEach(msgId => {
          const container = document.querySelector(`#msg-${msgId} .reactions-container`);
          if (!container) return;
          
          const emojis = allReactions[msgId];
          Object.keys(emojis).forEach(emoji => {
            const users = emojis[emoji];
            if (!users) return;
            const count = Object.keys(users).length;
            const isMine = users[myUid] === true;
            
            const pill = document.createElement('div');
            pill.className = 'reaction-pill' + (isMine ? ' mine' : '');
            pill.innerHTML = `${emoji} <span>${count}</span>`;
            pill.onclick = () => {
              const ref = db.ref(`rooms/${room}/reactions/${msgId}/${emoji}/${myUid}`);
              if (isMine) ref.remove(); else ref.set(true);
            };
            container.appendChild(pill);
          });
        });
      });
      const snap = await db.ref('users/' + myUid).once('value');
      if (!snap.exists()) { window.location.href = 'profile.html'; return; }

      const profile = snap.val();
      myName = profile.name; myAvatarType = profile.avatarType; myAvatarValue = profile.avatarValue;

      header.innerHTML = "";
      const myAvatar = createAvatarEl(myAvatarType, myAvatarValue, myName, myUid);
      myAvatar.style.cursor = "pointer";
      myAvatar.onclick = () => window.location.href = 'profile.html';

      const nameDiv = document.createElement("strong");
      nameDiv.textContent = myName; nameDiv.style.fontSize = "15px";

      const roomSpan = document.createElement("span");
      roomSpan.style.cssText = "opacity: 0.65; font-size: 12px;";
      roomSpan.textContent = `· ${room}`;

      const onlineCountEl = document.createElement("span");
      onlineCountEl.id = "onlineCount";
      onlineCountEl.style.cssText = "font-size:12px; margin-left:auto; cursor:pointer; background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:12px;";
      onlineCountEl.textContent = "🟢 0 online";
      onlineCountEl.onclick = toggleOnlineModal;

      const roomBtn = document.createElement("span");
      roomBtn.className = "room-btn";
      roomBtn.innerHTML = "🚪";
      roomBtn.title = "Switch Rooms";
      roomBtn.onclick = toggleRoomModal;

      header.appendChild(myAvatar); 
      header.appendChild(nameDiv); 
      header.appendChild(roomSpan);
      header.appendChild(roomBtn);
      header.appendChild(onlineCountEl);

      // Add Logout Button to Header
      const logoutBtn = document.createElement("button");
      logoutBtn.textContent = "Logout";
      logoutBtn.style.cssText = "background:transparent; border:1px solid rgba(255,255,255,0.2); color:#e5e7eb; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; margin-left:10px; transition:0.2s;";
      logoutBtn.onmouseover = () => { logoutBtn.style.background = '#ef4444'; logoutBtn.style.borderColor = '#ef4444'; };
      logoutBtn.onmouseout = () => { logoutBtn.style.background = 'transparent'; logoutBtn.style.borderColor = 'rgba(255,255,255,0.2)'; };
      logoutBtn.onclick = () => firebase.auth().signOut().then(() => location.href = 'login.html');
      
      header.appendChild(logoutBtn);
      updateOnlineUI();

      document.getElementById("nameBar").classList.add("hidden");
      chatForm.classList.remove("hidden");
      textInput.focus();

      // 1. Load ONLY the latest 30 messages initially
      messagesRef.orderByChild("ts").limitToLast(30).once("value", (snap) => {
        const initialMsgs = [];
        snap.forEach(child => {
          initialMsgs.push({ val: child.val(), key: child.key });
          if (child.val().ts < oldestTs) oldestTs = child.val().ts;
          if (child.val().ts > newestTs) newestTs = child.val().ts;
        });
        
        if (initialMsgs.length === 0) newestTs = Date.now(); // Fix for empty rooms

        initialMsgs.forEach(m => addMessage(m.val, m.key, false));

        // 2. NOW attach the real-time listener for brand new messages
        if (!newMsgListenerAttached) {
          messagesRef.orderByChild("ts").startAt(newestTs + 1).on("child_added", (s) => {
            addMessage(s.val(), s.key, false);
            if (s.val().ts > newestTs) newestTs = s.val().ts;
          });
          newMsgListenerAttached = true;
        }
      });
      
      // UPDATED: Uses replaceWith to update exactly in place
      messagesRef.on("child_changed", (s) => {
        const oldEl = document.getElementById("msg-" + s.key);
        const newRow = renderMessage(s.val(), s.key);
             cacheProfile(s.val());
        messagesCache[s.key] = s.val();
        if (oldEl) oldEl.replaceWith(newRow);
        updateOnlineUI();
      });
      
      messagesRef.on("child_removed", (s) => {
        const el = document.getElementById("msg-" + s.key);
        if (el) el.remove();
        delete messagesCache[s.key];
      });
    });
    let typingTimer = null;
    const typingRef = () => db.ref(`rooms/${room}/typing/${myUid}`);

    function startTyping() {
      if (!typingTimer) {
        typingRef().set(true);
        typingRef().onDisconnect().remove(); // Auto-removes if you close the tab
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        typingRef().remove();
        typingTimer = null;
      }, 2500); // Disappears 2.5 seconds after you stop typing
    }

    function stopTyping() {
      clearTimeout(typingTimer);
      typingTimer = null;
      typingRef().remove();
    }

    textInput.addEventListener('input', startTyping);

    db.ref(`rooms/${room}/typing`).on('value', async (snap) => {
      const typingUsers = snap.val() || {};
      delete typingUsers[myUid]; // Don't show yourself
      
      const uids = Object.keys(typingUsers);
      const indicator = document.getElementById('typingIndicator');
      
      if (uids.length === 0) {
        indicator.textContent = "";
        return;
      }

      // Fetch names from cache (or grab them if they just joined)
      const names = [];
      for (const uid of uids) {
        if (!userProfilesCache[uid]) {
          const s = await db.ref('users/' + uid).once('value');
          if (s.exists()) userProfilesCache[uid] = s.val();
        }
        names.push(userProfilesCache[uid]?.name || 'Someone');
      }
      
      if (names.length === 1) indicator.textContent = `${names[0]} is typing...`;
      else if (names.length === 2) indicator.textContent = `${names[0]} and ${names[1]} are typing...`;
      else indicator.textContent = `${names[0]} and ${names.length - 1} others are typing...`;
    });
    attachBtn.onclick = () => imageInput.click();

    imageInput.onchange = async () => {
      const file = imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("Please select an image file.");
        imageInput.value = "";
        return;
      }
      if (file.size > 200 * 1024 * 1024) {
        alert("File too large. Max 200MB.");
        imageInput.value = "";
        return;
      }

      sendBtn.disabled = true;
      attachBtn.disabled = true;
      attachBtn.textContent = "⏳";
      textInput.placeholder = "Uploading...";

      try {
        const formData = new FormData();
        formData.append("reqtype", "fileupload");
        formData.append("file", file);

        const res = await fetch("https://catbox.moe/user/api.php", {
          method: "POST",
          body: formData,
        });

        const url = await res.text();
        if (!url.startsWith("http")) throw new Error("Upload failed: " + url);

        textInput.value = url;
        textInput.focus();
      } catch (err) {
        alert("Upload failed: " + err.message);
      } finally {
        sendBtn.disabled = false;
        attachBtn.disabled = false;
        attachBtn.textContent = "📎";
        textInput.placeholder = "Type a message";
        imageInput.value = "";
      }
    };

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = textInput.value.trim();
      stopTyping();
      if (!text) return;
      sendBtn.disabled = true;

      try {
        if (editingId) {
          await messagesRef.child(editingId).update({ text: text, edited: true });
          editingId = null;
          sendBtn.textContent = "Send";
        } else {
          const newMsg = { uid: myUid, name: myName, avatarType: myAvatarType, avatarValue: myAvatarValue, text: text, ts: Date.now() };
          if (replyingTo) {
            newMsg.replyToId = replyingTo.id;
            newMsg.replyToName = replyingTo.name;
            newMsg.replyToText = replyingTo.text;
          }
          await messagesRef.push(newMsg);
          cancelReply();
        }
        textInput.value = "";
        textInput.focus();
      } catch (err) { alert("Failed: " + err.message); } 
      finally { sendBtn.disabled = false; }
    });
  </script>
    <div id="onlineModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Online Users</strong>
        <span class="close-modal" onclick="toggleOnlineModal()">×</span>
      </div>
      <div id="onlineList"></div>
    </div>
  </div>
    <div id="roomModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Rooms</strong>
        <span class="close-modal" onclick="toggleRoomModal()">×</span>
      </div>
      <input type="text" id="newRoomInput" placeholder="New room name..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; margin-bottom:10px; box-sizing:border-box;" />
      <button onclick="joinNewRoom()" style="width:100%; margin-bottom:15px;">Join / Create</button>
      <div style="font-size:12px; opacity:0.6; margin-bottom:8px;">Recent Rooms:</div>
      <div id="roomList"></div>
    </div>
  </div>
</body>
</html>
