<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mini Group Chat</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body class="chat-page">
  <!-- Header Bar (Full Width) -->
  <header id="chatHeader"></header>

  <!-- Messages Scroll Area (Full Width) -->
  <main id="messages" aria-live="polite"></main>

  <!-- Typing Indicator -->
  <div id="typingIndicator"></div>

  <!-- Composer Section with Docked Reply Bar (Full Width) -->
  <div class="composer-wrapper">
    <!-- Reply Preview Bar -->
    <div id="replyBar">
      <div class="reply-bar-info" id="replyName"></div>
      <span class="reply-bar-close" onclick="cancelReply()" title="Cancel reply (Esc)">×</span>
    </div>
    
    <!-- Message Composer Form -->
    <form id="chatForm" class="hidden">
      <input type="file" id="imageInput" accept="image/*" style="display: none;" />
      
      <div style="position: relative;">
        <button type="button" id="attachBtn" class="btn-attach" title="Attach image or GIF">+</button>
        <div id="attachMenu" class="attach-menu hidden">
          <button type="button" id="attachImageBtn" class="attach-menu-item">🖼️ Upload Image</button>
          <button type="button" id="attachGifBtn" class="attach-menu-item">🎞️ Search GIFs</button>
        </div>
      </div>

      <input type="text" id="textInput" placeholder="Type a message..." maxlength="1000" autocomplete="off" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <!-- Online Users Modal -->
  <div id="onlineModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Online Users</strong>
        <span class="close-modal" onclick="toggleOnlineModal()">×</span>
      </div>
      <div id="onlineList"></div>
    </div>
  </div>

  <!-- Room Switcher Drawer -->
  <div id="roomPanelOverlay" class="room-panel-overlay" onclick="closeRoomPanel()"></div>
  <div id="roomPanel" class="room-panel">
    <div class="room-panel-header">
      <h3>💬 Chat Rooms</h3>
      <button class="close-modal" onclick="closeRoomPanel()">×</button>
    </div>
    <div class="room-panel-content">
      <input type="text" id="newRoomInput" class="room-panel-input" placeholder="New room name..." onkeydown="if(event.key==='Enter') joinNewRoom()" />
      <button class="room-panel-btn" onclick="joinNewRoom()">Join / Create Room</button>
      <div class="room-panel-section">
        <div class="room-panel-section-label" style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; font-weight: 600;">Recent Rooms</div>
        <div id="roomPanelList"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
