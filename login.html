<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Group Chat - Login</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Mini Group Chat</h1>
    
    <div class="tabs">
      <div class="tab active" onclick="switchMode('login')">Login</div>
      <div class="tab" onclick="switchMode('signup')">Sign Up</div>
    </div>

    <div class="error-banner" id="errorMsg"></div>

    <form id="authForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Username here" autocomplete="username" required />
      </div>
      
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" autocomplete="current-password" required minlength="6" />
      </div>

      <label class="checkbox-field">
        <input type="checkbox" id="rememberMe" checked />
        Remember me on this device
      </label>

      <button type="submit" class="auth-submit-btn" id="submitBtn">Login</button>
    </form>

    <div class="auth-hint">Your username must be unique.</div>
    
    <div class="auth-footer">
      <a href="#" id="forceLogout">Stuck? Force Logout</a>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
