<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Mini Group Chat - Edit Profile</title>
  <link rel="stylesheet" href="css/base.css?v=5" />
  <link rel="stylesheet" href="css/auth.css?v=5" />
</head>
<body class="profile-page">
  <div class="profile-card">
    <h1>Edit Profile</h1>
    <div id="avatarPreview" class="avatar-preview" style="background: #2563eb;">?</div>

    <div class="field">
      <label for="nameInput">Username</label>
      <input type="text" id="nameInput" placeholder="Enter unique name" maxlength="20" autocomplete="off" />
      <div class="field-error" id="nameError"></div>
    </div>

    <div class="field">
      <label>Avatar Style</label>
      <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 14px;">
        <label style="margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-main); font-size: 14px;">
          <input type="radio" name="avatarType" value="initials" checked style="accent-color: var(--primary);" /> Initials
        </label>
        <label style="margin: 0; display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-main); font-size: 14px;">
          <input type="radio" name="avatarType" value="preset" style="accent-color: var(--primary);" /> Emoji
        </label>
      </div>

      <div id="initialsOptions">
        <label>Palette Presets</label>
        <div class="color-presets" id="colorPresetsList"></div>
        <label for="colorInput" style="margin-top: 8px;">Custom Color</label>
        <input type="color" id="colorInput" value="#2563eb" style="height: 40px; padding: 3px; cursor: pointer;" />
      </div>

      <div id="presetOptions" style="display: none;">
        <label>Choose an Emoji</label>
        <div class="presets" id="presetList"></div>
      </div>
    </div>

    <button id="saveBtn" class="auth-submit-btn">Save Profile</button>
    <div class="field-error" id="saveError" style="text-align: center; margin-top: 10px;"></div>

    <div class="auth-footer">
      <a href="index.html">← Back to Chat</a>
      <span style="opacity: 0.3; margin: 0 10px;">|</span>
      <a href="#" id="logoutBtn" style="color: var(--danger);">Logout</a>
    </div>
  </div>

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-init.js?v=5"></script>
  <script src="js/profile.js?v=5"></script>
</body>
</html>
